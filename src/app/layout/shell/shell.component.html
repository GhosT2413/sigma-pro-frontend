<div class="shell">
  <sigma-sidebar #sidebar />
  <div class="shell__contenido">
    <sigma-topbar (toggleMenu)="sidebar.abrir()" />
    <main class="shell__main">
      @if (mostrarAdvertenciaGoogle()) {
        <div class="alerta-google-perfil">
          <div class="alerta-google-perfil__icono">⚠️</div>
          <div class="alerta-google-perfil__texto">
            <strong>Advertencia:</strong> debes agregar tu rut.
          </div>
          <a routerLink="/perfil" class="alerta-google-perfil__btn">Completar ahora</a>
        </div>
      }
      <router-outlet />
    </main>
  </div>
</div>
<div class="shell__overlay" [class.shell__overlay--visible]="sidebar.abierto()" (click)="sidebar.cerrar()"></div>
