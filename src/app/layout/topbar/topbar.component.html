<header class="topbar">
  <div class="topbar__left">
    <button class="topbar__menu-btn" (click)="toggleMenu.emit()" aria-label="Abrir menú">☰</button>
  </div>
  @if (auth.usuario(); as usuario) {
    <div class="topbar__usuario">
      <div class="topbar__datos">
        <strong class="topbar__nombre">{{ nombreMostrado() }}</strong>
        @if (!esTaller()) {
          <span class="topbar__rol">{{ roleLabels[usuario.rol] }}</span>
        }
      </div>
      <button class="topbar__avatar-btn" (click)="toggleMenu.emit()" aria-label="Menú de usuario" title="{{ nombreMostrado() }}">
        {{ (nombreMostrado() || 'U').charAt(0).toUpperCase() }}
      </button>
    </div>
  }
</header>
