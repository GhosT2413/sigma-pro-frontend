<header class="topbar">
  <div class="topbar__left">
    <button class="topbar__menu-btn" (click)="toggleMenu.emit()">☰</button>
  </div>
  @if (auth.usuario(); as usuario) {
    <div class="topbar__usuario">
      <div class="topbar__datos">
        <strong>{{ usuario.nombreCompleto }}</strong>
        <span class="topbar__rol">{{ roleLabels[usuario.rol] }}</span>
      </div>
      <button class="sigma-btn sigma-btn--outline" (click)="cerrarSesion()">Cerrar sesión</button>
    </div>
  }
</header>
